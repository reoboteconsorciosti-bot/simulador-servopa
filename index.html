<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reobote Consórcios - Simulador Servopa</title>
  <link rel="icon" type="image/jpeg" href="/favicon_new.jpg">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Configura o Tailwind CSS para usar o modo de classe para o tema escuro.
    // Isso é essencial para que o botão de alternância de tema funcione.
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html {
      font-size: 112.5%;
      /* 18px base */
      overflow-y: scroll;
      /* Garante que a barra de rolagem esteja sempre presente, evitando saltos de layout */
    }

    body {
      font-family: 'Poppins', sans-serif;
    }
  </style>
  <link rel="stylesheet" href="/index.css">
</head>

<body>
  <div id="root"></div>
  <script type="importmap">
  {
    "imports": {
      "react": "https://aistudiocdn.com/react@^19.2.0",

      "react/": "https://aistudiocdn.com/react@^19.2.0/"
    }
  }
  </script>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
